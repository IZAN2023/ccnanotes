---
- name: 配置 IOS-XE 路由器
  hosts: routers
  gather_facts: no                              # 网络设备不支持标准的 setup 模块采集方式

  tasks:
    - name: 配置 hostname
      cisco.ios.ios_config:
        lines:
          - hostname {{ inventory_hostname }}

    - name: 配置 Loopback10 接口地址
      cisco.ios.ios_config:
        lines:
          - ip address {{ loopback_ip }} 255.255.255.255
        parents: interface Loopback10

    - name: 配置 NTP 服务器
      cisco.ios.ios_config:
        lines:
          - ntp server 192.168.17.1

    - name: 保存配置到 startup-config
      cisco.ios.ios_config:
        save_when: modified